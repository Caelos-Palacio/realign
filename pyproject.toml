[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realign-harness"
version = "0.2.0"
description = "Evidence-based project coherence checks and bounded repairs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
realign = "realign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
